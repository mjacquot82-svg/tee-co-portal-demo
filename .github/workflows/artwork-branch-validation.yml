name: Isolated artwork branch validation
on:
  push:
    branches: [fix/customer-artwork-request]
permissions:
  contents: read
concurrency:
  group: isolated-artwork-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-validation:
    if: github.repository == 'mjacquot82-svg/tee-co-portal-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install hosted test runtimes
        run: |
          node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
          python -m pip install 'Pillow>=11,<13'
      - name: Run sequential checks with loopback only and no inherited credentials
        shell: bash
        run: |
          sudo unshare --net -- bash -c '
            set -eu
            ip link set lo up
            exec setpriv --reuid="$1" --regid="$2" --init-groups env -i \
              HOME="$3" PATH="$4" CI=true \
              VITE_SUPABASE_URL= VITE_SUPABASE_ANON_KEY= VITE_SUPABASE_PUBLISHABLE_KEY= \
              PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173 \
              bash "$5/scripts/run-artwork-offline-ci.sh"
          ' _ "$(id -u)" "$(id -g)" "$HOME" "$PATH" "$GITHUB_WORKSPACE"
      - name: Preserve bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-artwork-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9
          include-hidden-files: false
